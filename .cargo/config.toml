[target.x86_64-unknown-linux-musl]
linker = "zig-cc-musl"
# NOTE: only applied when RUSTFLAGS is unset (outside devenv). Inside devenv,
# mold.enable sets RUSTFLAGS which overrides this file — the release task
# appends the same flag to RUSTFLAGS there (devenv.nix).
rustflags = ["-C", "link-self-contained=no"]
