<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>log-sidecar</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <h1>logs</h1>
        <ul id="file-list"></ul>
      </aside>
      <div id="main">
        <div id="toolbar">
          <input id="query" placeholder="search… (Enter to run, Esc to cancel)" autocomplete="off" aria-label="Search query" />
          <button id="search-btn" title="Search (Enter)">🔍</button>
          <label class="check"><input type="checkbox" id="regex" /> regex</label>
          <select id="direction" aria-label="Search direction">
            <option value="reverse">newest first</option>
            <option value="forward">oldest first</option>
          </select>
          <label class="check"><input type="checkbox" id="follow" /> follow</label>
          <select id="tail-limit" aria-label="Lines to load">
            <option value="500">500 lines</option>
            <option value="1000">1 000 lines</option>
            <option value="1500">1 500 lines</option>
            <option value="2000">2 000 lines</option>
          </select>
          <span id="match-nav">
            <button id="prev-match" title="Previous match (Shift+F3)">▲</button>
            <span id="match-pos"></span>
            <button id="next-match" title="Next match (F3)">▼</button>
          </span>
          <button id="back-to-search" style="display: none;" title="Return to search results">← results</button>
          <button id="clear-search" title="Return to log view">✕ clear</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
        <div id="viewport">
          <div id="sizer"><div id="content"></div></div>
        </div>
      </div>
      <aside id="rail"></aside>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
