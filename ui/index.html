<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>log-sidecar</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <div id="sidebar-header">
          <h1>logs</h1>
          <div id="file-select-actions">
            <button id="select-all-files" type="button" title="Select all files (Ctrl+A)">all</button>
            <button id="select-none-files" type="button" title="Clear selection (Esc)">none</button>
          </div>
        </div>
        <ul id="file-list"></ul>
      </aside>
      <div id="main">
        <div id="toolbar">
          <input id="query" placeholder="search… (Enter to run, Esc to cancel)" autocomplete="off" aria-label="Search query" />
          <button id="search-btn" title="Search (Enter)">🔍</button>
          <button id="save-pattern" title="Save current search pattern (Ctrl+S)">★</button>
          <div id="pattern-picker" class="picker-wrapper">
            <button id="pattern-btn" title="Saved patterns">📋</button>
            <div id="pattern-dropdown" class="picker-dropdown">
              <ul id="pattern-list"></ul>
              <div class="picker-footer">
                <button id="manage-patterns">manage…</button>
              </div>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="regex" /> regex</label>
          <select id="direction" aria-label="Search direction">
            <option value="reverse">newest first</option>
            <option value="forward">oldest first</option>
          </select>
          <label class="check"><input type="checkbox" id="follow" /> follow</label>
          <select id="tail-limit" aria-label="Lines to load">
            <option value="500">500 lines</option>
            <option value="1000">1 000 lines</option>
            <option value="1500">1 500 lines</option>
            <option value="2000">2 000 lines</option>
          </select>
          <span id="match-nav">
            <button id="prev-match" title="Previous match (Shift+F3)">▲</button>
            <span id="match-pos"></span>
            <button id="next-match" title="Next match (F3)">▼</button>
          </span>
          <button id="back-to-search" style="display: none;" title="Return to search results">← results</button>
          <button id="clear-search" title="Return to log view">✕ clear</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
        <div id="viewport">
          <div id="sizer"><div id="content"></div></div>
        </div>
      </div>
      <aside id="rail"></aside>
    </div>
    <dialog id="pattern-dialog">
      <h2>Saved Patterns</h2>
      <ul id="dialog-pattern-list"></ul>
      <div class="dialog-actions">
        <button id="close-patterns">Close</button>
      </div>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
